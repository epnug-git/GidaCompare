<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIDA Compare</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--card:#121b2d;--card2:#0e1626;--accent:#f97316;--blue:#38bdf8;--text:#f1f5f9;--muted:#8b9bb4;--border:#223049;--ok:#22c55e;--warn:#eab308;--bad:#ef4444;--fd:'Space Grotesk','IBM Plex Sans',sans-serif;--fb:'IBM Plex Sans','Segoe UI',sans-serif}
*{box-sizing:border-box}
body{margin:0;padding:0 16px 40px;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;display:flex;justify-content:center}
.wrap{max-width:1200px;width:100%}
.top{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.top img.m{height:30px}.top .g{background:#fff;border-radius:6px;padding:4px 10px}.top .g img{height:18px;display:block}
.top .sp{flex:1}.top .tt{font-family:var(--fd);font-weight:600;font-size:1.05rem}
h2{font-family:var(--fd);font-size:1rem;margin:0 0 12px;color:var(--blue);font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;font:inherit}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.btn{background:var(--accent);color:#111;border:0;border-radius:6px;padding:10px 16px;font:600 .9rem var(--fb);cursor:pointer}
.btn.s{background:var(--card2);color:var(--text);border:1px solid var(--border)}.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.drop{border:2px dashed var(--border);border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.drop.on{border-color:var(--accent);color:var(--text)}
.msg{border-radius:8px;padding:10px 12px;margin-top:10px;font-size:.85rem}
.msg.e{background:rgba(239,68,68,.12);border:1px solid var(--bad)}.msg.w{background:rgba(234,179,8,.1);border:1px solid var(--warn)}.msg.o{background:rgba(34,197,94,.1);border:1px solid var(--ok)}
.msg ul{margin:6px 0 0 18px;padding:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.kpi{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:12px}
.kpi b{display:block;font:600 1.25rem var(--fd);margin-top:4px}.kpi span{font-size:.75rem;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{background:#1f4e78;color:#fff;text-align:center;position:sticky;top:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.sec td{background:#16253d;font-weight:600;color:var(--blue)}
tr.sub td{background:#16311f;font-weight:600}
tr.tot td{background:#1d3b2a;font-weight:700;border-top:2px solid var(--ok)}
tr.as td.a{background:rgba(234,179,8,.12)}
.mut{color:var(--muted);font-size:.78rem}
.hide{display:none}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media(max-width:720px){.charts{grid-template-columns:minmax(0,1fr)}}
.charts figure{margin:0}.charts figure.wide{grid-column:1/-1}
.charts h3{font:600 .85rem var(--fd);margin:0 0 6px;color:var(--muted)}
.charts svg{width:100%;height:auto;display:block}
.printnote{display:none;font-size:.8rem;color:var(--muted)}
@page{size:A4 landscape;margin:10mm}
@media print{:root{--text:#000;--muted:#555;--border:#ccc}body{background:#fff;color:#000}.card{border-color:#ccc;background:#fff}.noprint{display:none!important}th{background:#1f4e78!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.charts{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px 14px!important}.charts figure{break-inside:avoid;page-break-inside:avoid}.charts figure.wide{grid-column:1/-1}.charts svg{max-height:62mm}.card.cc{break-inside:auto}.detail{display:none!important}.printnote{display:block!important}#sum.tw{overflow:visible}#sum table{font-size:.52rem;table-layout:auto}#sum th,#sum td{padding:3px 1px}#sum th:first-child,#sum td:first-child{white-space:normal;min-width:52px}.card{break-inside:avoid}td,.kpi b{color:#000}tr.sec td,tr.sub td,tr.tot td{background:#eef!important;color:#000}.kpi{background:#fff}}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:720px){.cols{grid-template-columns:minmax(0,1fr)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}.dot.a{background:#38bdf8}.dot.b{background:#f97316}
.verdict{font:600 1.05rem var(--fd);line-height:1.5;padding:12px 14px;background:var(--card2);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px}
td.good{color:#22c55e;font-weight:600}td.badc{color:#ef4444;font-weight:600}
th.ha{background:#1c6f99}th.hb{background:#b3541a}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:6px}.lg i{display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:middle}
#chart svg{width:100%;height:auto;display:block}
</style>
</head>

<script>
/* GIDA Parts & Cash Out — mesin hitung (tanpa DOM, bisa diuji di Node) */
(function (root) {
'use strict';

/* ---------- Data model ---------- */
const SPECS = {
  'GD9-M':  { pv: 1785, bat: 10240, ch: 3600, lamp: 800,  price: 260000000 },
  'GDQ9-M': { pv: 3570, bat: 32153, ch: 3600, lamp: 1200, price: 404900000 },
  'GD7-H':  { pv: 1785, bat: 16076, ch: 3600, lamp: 600,  price: 245200000 },
  'GD9-H':  { pv: 2130, bat: 16076, ch: 3600, lamp: 800,  price: 312000000 },
  'GD12-H': { pv: 2975, bat: 32153, ch: 3600, lamp: 1200, price: 427200000 }
};
const WEATHER = [
  { id: 'gelap', psh: 0 },
  { id: 'mendung', psh: 1.5 },
  { id: 'berawan', psh: 3.0 },
  { id: 'cerah', psh: 4.5 }
];
const DEG_TABLE = { 50: 0.012, 55: 0.014, 60: 0.016, 65: 0.018, 70: 0.021, 75: 0.025, 80: 0.028, 85: 0.032, 90: 0.037, 95: 0.041, 100: 0.045 };
const FUEL_LPH = 16 / 12;      // liter per jam genset menyala
const GEN_RATED_W = 5000;     // daya genset (W)
const INV_RATED_W = 3600;     // daya inverter (W)
const DT = 1 / 12;             // langkah 5 menit (jam)

function degPerYear(dod) {
  if (DEG_TABLE[dod] !== undefined) return DEG_TABLE[dod];
  const keys = Object.keys(DEG_TABLE).map(Number).sort((a, b) => a - b);
  let lo = keys[0], hi = keys[keys.length - 1];
  for (let i = 0; i < keys.length - 1; i++) if (dod >= keys[i] && dod <= keys[i + 1]) { lo = keys[i]; hi = keys[i + 1]; break; }
  if (lo === hi) return DEG_TABLE[lo];
  return DEG_TABLE[lo] + (dod - lo) / (hi - lo) * (DEG_TABLE[hi] - DEG_TABLE[lo]);
}
const r9 = v => Math.round(v * 1e9) / 1e9;
const r2 = v => Math.round(v * 100) / 100;

/* ---------- Mesin simulasi 5 menit ----------
   Sama dengan simulator operasional: PV bentuk lonceng, lampu dari baterai lewat inverter,
   genset -> charger -> baterai, balancing 100% periodik, precharge opsional.
   Tambahan: kapasitas baterai turun linier menurut degradasi (opsional). */
function runEngine(p) {
  const spec = SPECS[p.model];
  const bat0 = spec.bat, ch = spec.ch;
  const chEff = p.chEff / 100, pvEff = p.pvEff / 100, invEff = p.invEff / 100;
  const lampBat = p.lamp / invEff;
  const bypass = p.gPath === 'bypass';
  // bypass: genset langsung ke lampu; sisa daya genset ke charger (maks. kapasitas charger)
  const genSlope = bypass ? Math.max(0, Math.min(ch, GEN_RATED_W - p.lamp)) * chEff : (ch * chEff - lampBat);
  const N = p.nights, off = p.off;
  const sh_ = h => (((h - off) % 24) + 24) % 24;
  const sStart = sh_(p.sStart), sStop = sh_(p.sStop);
  const shiftHrs = ((sStop - sStart) + 24) % 24 || 24;
  const lastEnd = 24 * (N - 1) + sStart + shiftHrs;
  const crossing = lastEnd > 24 * N + 1e-9;
  const rows = crossing ? N + 1 : N;
  const spd = Math.round(24 / DT);
  const steps = spd * rows;
  let sr = sh_(p.sunrise), ss = sh_(p.sunset);
  if (ss <= sr) ss = 24;
  const span = Math.max(0.1, ss - sr);
  const dayGain = spec.pv * p.psh * pvEff;
  const pvW = T => {
    const d = Math.floor(T / 24);
    if (d >= rows) return 0;
    const h = T - 24 * d;
    if (h < sr || h >= ss) return 0;
    return dayGain * (Math.PI / 2) / span * Math.sin(Math.PI * (h - sr) / span);
  };
  const dpy = p.degr ? p.degPerYear : 0;
  const capRow = new Float64Array(rows);
  for (let d = 0; d < rows; d++) capRow[d] = bat0 * Math.max(0.3, 1 - dpy * (d * shiftHrs) / p.hoursPerYear);

  const shifts = [];
  for (let k = 0; k < N; k++) {
    const cap = capRow[k];
    const trig = cap * (100 - p.dod) / 100;
    const st = 24 * k + sStart, en = st + shiftHrs;
    const preH_ = sh_(p.preHour);
    let pre = preH_ < sStart ? 24 * k + preH_ : 24 * (k - 1) + preH_;
    const bal = p.bal > 0 && ((k + 1) % p.bal === 0);
    if (!p.preOn && !bal) pre = Infinity;
    if (bal) pre = Math.min(pre, Math.max(24 * k, st - 12));
    const target = bal ? cap : Math.min(cap, trig + lampBat * shiftHrs);
    const stop = p.gMode === 'cont' ? Infinity : (p.gMode === 'full' ? cap : Math.max(trig + 1, Math.min(cap, cap * p.gPct / 100)));
    shifts.push({ k, st, en, pre: Math.max(0, pre), target, bal, cap, trig, stop, preH: 0, genH: 0, starts: 0, latched: false });
  }
  let soc = bat0 * p.soc0 / 100;
  let lampGapWh = 0, socMinPct = 100, pvAvail = 0, pvWaste = 0;
  const projPV = (T0, s0, Tend, cap) => { let s = s0; for (let T = T0; T < Tend; T += DT) s = Math.min(cap, s + pvW(T) * DT); return s; };

  for (let i = 0; i < steps; i++) {
    const T = i * DT, d = Math.floor(T / 24);
    const cap = capRow[Math.min(d, rows - 1)];
    if (soc > cap) soc = cap;
    let sh = null;
    for (let k = Math.max(0, d - 1); k <= Math.min(N - 1, d + 1); k++) { const x = shifts[k]; if (T >= x.st - 1e-9 && T < x.en - 1e-9) { sh = x; break; } }
    const pv = pvW(T);
    const cnt = T < lastEnd - 1e-9;
    if (cnt) pvAvail += pv * DT;
    if (sh) {
      if (!sh.latched && soc <= sh.trig + 1e-6) { sh.latched = true; sh.starts++; }
      // Genset berhenti/mulai TEPAT di titik SOC-nya di dalam langkah 5 menit (bukan dibulatkan ke batas langkah)
      if (sh.latched) {
        const r = genSlope + pv;                       // daya bersih ke baterai saat genset menyala (W)
        const nx = soc + r * DT;
        if (r > 0 && nx >= sh.stop - 1e-6) {
          const f = Math.max(0, Math.min(1, (sh.stop - soc) / (r * DT)));
          sh.genH += f * DT;
          soc = sh.stop + (pv - lampBat) * (1 - f) * DT;   // sisa langkah: genset mati, lampu dari baterai
          sh.latched = false;
        } else { sh.genH += DT; soc = nx; }
      } else {
        const dr = pv - lampBat, nx = soc + dr * DT;
        const f0 = dr < 0 ? (soc - sh.trig) / (-dr * DT) : 1;   // bagian langkah sebelum SOC menyentuh pemicu
        const onT = (1 - f0) * DT;
        if (dr < 0 && nx < sh.trig - 1e-6 && onT > 1e-4) {
          sh.latched = true; sh.starts++; sh.genH += onT;
          soc = sh.trig + (genSlope + pv) * onT;
        } else soc = nx;
      }
      if (soc > sh.cap) { if (cnt) pvWaste += Math.min(soc - sh.cap, pv * DT); soc = sh.cap; }
      if (soc < 0) { lampGapWh += -soc; soc = 0; }
      const pct = soc / sh.cap * 100; if (pct < socMinPct) socMinPct = pct;
    } else {
      let pc = null;
      for (let k = Math.max(0, d); k <= Math.min(N - 1, d + 1); k++) { const x = shifts[k]; if (T >= x.pre - 1e-9 && T < x.st - 1e-9) { pc = x; break; } }
      let on = false;
      if (pc && soc < pc.cap - 1e-6) { if (projPV(T, soc, pc.st, pc.cap) < pc.target - 1e-6) on = true; }
      if (on) {
        // lama genset di langkah ini = waktu minimum agar langkah berikutnya tidak lagi butuh precharge
        const Tn = T + DT, base = soc + pv * DT, g = ch * chEff;
        const ok = t => projPV(Tn, Math.min(cap, base + g * t), pc.st, pc.cap) >= pc.target - 1e-6;
        let t = DT;
        if (ok(0)) t = 0;
        else if (ok(DT)) { let lo = 0, hi = DT; for (let q = 0; q < 40; q++) { const mid = (lo + hi) / 2; if (ok(mid)) hi = mid; else lo = mid; } t = hi; }
        pc.preH += t; soc = base + g * t;
      } else soc += pv * DT;
      if (soc > cap) { if (cnt) pvWaste += Math.min(soc - cap, pv * DT); soc = cap; }
    }
  }
  const genH = new Float64Array(N), preH = new Float64Array(N);
  let totalGen = 0, totalPre = 0, starts = 0, nightsGen = 0;
  for (const s of shifts) { genH[s.k] = s.genH; preH[s.k] = s.preH; totalGen += s.genH; totalPre += s.preH; starts += s.starts; if (s.genH > 0) nightsGen++; }
  return { N, shiftHrs, genH, preH, totalGen, totalPre, starts, nightsGen, lampGapWh, socMinPct, pvAvail, pvWaste,
           lampBat, bypass, chargerNet: ch * chEff, capEnd: capRow[Math.min(N, rows) - 1] / bat0 };
}

/* ---------- Bucket per tahun (jam lampu) ---------- */
function bucketize(sim, projectHours, H) {
  const nB = Math.max(1, Math.ceil(projectHours / H - 1e-9));
  const buckets = [];
  for (let y = 1; y <= nB; y++) buckets.push({ y, lo: (y - 1) * H, hi: Math.min(y * H, projectHours), genPeriod: 0 });
  const sh = sim.shiftHrs;
  for (let k = 0; k < sim.N; k++) {
    const a = k * sh, b = (k + 1) * sh, tot = sim.genH[k] + sim.preH[k];
    if (tot <= 0) continue;
    for (const bk of buckets) {
      const ov = Math.min(b, bk.hi) - Math.max(a, bk.lo);
      if (ov > 0) bk.genPeriod += tot * ov / (b - a);
    }
  }
  let cum = 0;
  for (const bk of buckets) {
    bk.genPeriod = r2(bk.genPeriod);
    cum = r2(cum + bk.genPeriod);
    bk.lampCum = bk.hi;
    bk.genCum = cum;
    bk.lampPeriod = bk.hi - bk.lo;
  }
  return buckets;
}

/* ---------- Parser sheet Parts ---------- */
const HEADERS = ['Model', 'Part No', 'Kategori', 'Komponen', 'Satuan', 'Harga jual', 'Jumlah', 'Basis jam', 'Interval ganti (jam)', 'Watt per part', 'Status data', 'Versi list', 'Catatan'];
const REQUIRED = ['Model', 'Part No', 'Komponen', 'Harga jual', 'Jumlah', 'Basis jam', 'Interval ganti (jam)'];
const norm = s => String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ' ').trim();

function toNum(v) {
  if (typeof v === 'number') return v;
  if (v == null) return NaN;
  let s = String(v).trim().replace(/\s/g, '').replace(/^rp\.?/i, '');
  if (s === '') return NaN;
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d+,\d+$/.test(s)) s = s.replace(',', '.');
  else if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
  const n = Number(s);
  return isFinite(n) ? n : NaN;
}

/* Pesan galat berupa {row, k, a}: kunci kamus + argumen, diterjemahkan oleh pemanggil. */
function parsePartsRows(rows, selectedModel, rowOffset) {
  const off = rowOffset || 0;
  const errors = [], warnings = [];
  let hi = -1, oldPrice = false;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const cells = (rows[i] || []).map(norm);
    if (cells.includes('part no') && (cells.includes('harga jual') || cells.includes('harga beli'))) { hi = i; oldPrice = !cells.includes('harga jual'); break; }
  }
  if (hi < 0) return { parts: [], errors: [{ row: 0, k: 'e_nohdr' }], warnings, meta: {} };
  if (oldPrice) return { parts: [], errors: [{ row: hi + 1 + off, k: 'e_oldprice' }], warnings, meta: {} };
  const idx = {};
  (rows[hi] || []).forEach((h, c) => { const n = norm(h); HEADERS.forEach(H => { if (norm(H) === n && idx[H] === undefined) idx[H] = c; }); });
  const missing = REQUIRED.filter(h => idx[h] === undefined);
  if (missing.length) return { parts: [], errors: [{ row: hi + 1 + off, k: 'e_miss', a: { list: missing.join(', ') } }], warnings, meta: {} };
  const get = (r, h) => (idx[h] === undefined ? null : r[idx[h]]);
  const txt = v => (v == null ? '' : String(v).trim());
  const parts = [], seen = {}, models = {};
  let versi = '';
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i] || [];
    const rowNo = off + i + 1;
    if (r.every(v => v == null || String(v).trim() === '')) continue;
    const partNo = txt(get(r, 'Part No')), nm = txt(get(r, 'Komponen'));
    if (/^total/i.test(partNo) || /^total/i.test(nm) || /^total/i.test(txt(get(r, 'Model')))) continue;
    const model = txt(get(r, 'Model'));
    const e = (k, a) => errors.push({ row: rowNo, k, a });
    if (!model) e('e_model0'); else models[model] = (models[model] || 0) + 1;
    if (!partNo) e('e_pn0');
    else if (seen[partNo.toLowerCase()]) e('e_pndup', { p: partNo, r: seen[partNo.toLowerCase()] });
    else seen[partNo.toLowerCase()] = rowNo;
    if (!nm) e('e_name0');
    const harga = toNum(get(r, 'Harga jual'));
    if (!(harga >= 0)) e('e_price');
    const qty = toNum(get(r, 'Jumlah'));
    if (!(qty >= 0)) e('e_qty');
    const basisRaw = norm(get(r, 'Basis jam'));
    const basis = basisRaw === 'jam lampu' ? 'Jam lampu' : (basisRaw === 'jam genset' ? 'Jam genset' : null);
    if (!basis) e('e_basis');
    const statRaw = norm(get(r, 'Status data'));
    const status = statRaw === 'resmi' ? 'Resmi' : (statRaw === '' || statRaw === 'asumsi' ? 'Asumsi' : null);
    if (!status) e('e_status');
    const interval = toNum(get(r, 'Interval ganti (jam)'));
    if (qty > 0 && !(interval > 0)) e('e_interval');
    let kat = txt(get(r, 'Kategori'));
    if (!kat) { kat = 'Lainnya'; warnings.push({ row: rowNo, k: 'w_cat' }); }
    const v = txt(get(r, 'Versi list')); if (v && !versi) versi = v;
    parts.push({ row: rowNo, model, partNo, kategori: kat, komponen: nm, satuan: txt(get(r, 'Satuan')) || '-', harga, qty, basis, interval: interval > 0 ? interval : null,
                 watt: toNum(get(r, 'Watt per part')), status, versi: v, catatan: txt(get(r, 'Catatan')) });
  }
  const modelList = Object.keys(models);
  if (modelList.length > 1) errors.push({ row: 0, k: 'e_multi', a: { list: modelList.join(', ') } });
  if (modelList.length === 1 && selectedModel && modelList[0] !== selectedModel)
    errors.push({ row: 0, k: 'e_wrong', a: { file: modelList[0], menu: selectedModel }, fatalModel: modelList[0] });
  if (!parts.length && !errors.length) errors.push({ row: 0, k: 'e_nodata' });
  const active = parts.filter(p => p.qty > 0);
  if (!errors.length && !active.length) errors.push({ row: 0, k: 'e_allzero' });
  return { parts, errors, warnings, meta: { model: modelList[0] || '', versi, nAsumsi: active.filter(p => p.status === 'Asumsi').length, nActive: active.length } };
}

/* ---------- Cash out per bucket (harga = harga jual apa adanya) ---------- */
function cashOut(parts, buckets) {
  const groups = [], gmap = {};
  const nB = buckets.length;
  for (const p of parts) {
    if (!(p.qty > 0)) continue;
    const unit = p.harga;
    const costs = new Array(nB).fill(0), counts = new Array(nB).fill(0);
    let prev = 0;
    for (let i = 0; i < nB; i++) {
      const X = p.basis === 'Jam genset' ? buckets[i].genCum : buckets[i].lampCum;
      const c = Math.floor(r9(X / p.interval));
      counts[i] = (c - prev) * p.qty;
      costs[i] = counts[i] * unit;
      prev = c;
    }
    let g = gmap[p.kategori];
    if (!g) { g = gmap[p.kategori] = { kategori: p.kategori, rows: [], sub: new Array(nB).fill(0) }; groups.push(g); }
    g.rows.push({ part: p, unit, costs, counts, total: costs.reduce((a, b) => a + b, 0) });
    for (let i = 0; i < nB; i++) g.sub[i] += costs[i];
  }
  const partsTot = new Array(nB).fill(0);
  groups.forEach(g => g.sub.forEach((v, i) => { partsTot[i] += v; }));
  return { groups, partsTot };
}

/* ---------- Hitung semuanya ---------- */
function compute(parts, p) {
  const shiftH = ((p.sStop - p.sStart) + 24) % 24 || 24;
  const nights = Math.ceil(p.projectHours / shiftH - 1e-9);
  const sim = runEngine(Object.assign({}, p, { nights, off: 6, sunrise: 6, sunset: 18, soc0: 100 }));
  const buckets = bucketize(sim, p.projectHours, p.hoursPerYear);
  const co = cashOut(parts, buckets);
  const bbmL = buckets.map(b => b.genPeriod * FUEL_LPH);
  const bbmRp = bbmL.map(l => l * p.fuelPrice);
  const total = buckets.map((b, i) => co.partsTot[i] + bbmRp[i]);
  return { sim, buckets, co, bbmL, bbmRp, total };
}

/* ---------- Deret kumulatif per jam lampu (untuk grafik) ---------- */
function cumulative(parts, res, p, nPts) {
  const sim = res.sim, sh = sim.shiftHrs, N = sim.N, H = p.projectHours;
  const gcum = [0];
  for (let k = 0; k < N; k++) gcum.push(gcum[k] + sim.genH[k] + sim.preH[k]);
  const genAt = h => { h = Math.max(0, Math.min(h, N * sh)); const k = Math.min(N - 1, Math.floor(h / sh)); const f = (h - k * sh) / sh; return gcum[k] + f * (gcum[k + 1] - gcum[k]); };
  const genToLamp = X => { let lo = 0, hi = N * sh; for (let i = 0; i < 50; i++) { const mid = (lo + hi) / 2; if (genAt(mid) >= X - 1e-9) hi = mid; else lo = mid; } return hi; };
  const events = {};                       // kategori -> [[jamLampu, biaya]]
  const genEnd = genAt(H);
  for (const q of parts) {
    if (!(q.qty > 0) || !(q.interval > 0)) continue;
    const arr = events[q.kategori] || (events[q.kategori] = []);
    const lim = q.basis === 'Jam genset' ? genEnd : H;
    for (let i = 1; r9(i * q.interval) <= r9(lim); i++) {
      const X = i * q.interval;
      arr.push([q.basis === 'Jam genset' ? genToLamp(X) : X, q.qty * q.harga]);
    }
  }
  nPts = nPts || 240;
  const xs = []; for (let i = 0; i <= nPts; i++) xs.push(H * i / nPts);
  const series = [{ name: '__bbm', vals: xs.map(h => genAt(h) * FUEL_LPH * p.fuelPrice) }];
  Object.keys(events).forEach(k => {
    const ev = events[k].slice().sort((a, b) => a[0] - b[0]);
    let j = 0, acc = 0;
    const vals = xs.map(h => { while (j < ev.length && ev[j][0] <= h + 1e-9) { acc += ev[j][1]; j++; } return acc; });
    series.push({ name: k, vals });
  });
  return { xs, series };
}

/* ---------- Template kosong ---------- */
function buildTemplate(ExcelJS, lang) {

    c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };

  });
  ws.getRow(1).height = 32;
  for (let r = 2; r <= 300; r++) for (let c = 1; c <= HEADERS.length; c++) { const cell = ws.getCell(r, c); cell.font = { name: 'Arial', size: 10, color: { argb: 'FF0000FF' } }; cell.border = border; if ([6, 7, 9, 10].includes(c)) cell.numFmt = '#,##0'; }
  const dv = (col, formula) => { for (let r = 2; r <= 300; r++) ws.getCell(col + r).dataValidation = { type: 'list', allowBlank: true, formulae: [formula] }; };
  dv('A', '"GD9-M,GDQ9-M,GD7-H,GD9-H,GD12-H"'); dv('H', '"Jam lampu,Jam genset"'); dv('K', '"Resmi,Asumsi"');
  ws.columns = [{ width: 9 }, { width: 12 }, { width: 20 }, { width: 38 }, { width: 8 }, { width: 13 }, { width: 9 }, { width: 12 }, { width: 14 }, { width: 10 }, { width: 11 }, { width: 16 }, { width: 50 }];
  ws.views = [{ state: 'frozen', xSplit: 4, ySplit: 1 }];

}

const $=id=>document.getElementById(id);
let LANG='id';try{const s=localStorage.getItem('gida_lang');if(s&&GIDA.LANGS.includes(s))LANG=s}catch(e){}
const UD={
 ui_print:['Cetak / PDF','Print / PDF'],
 title:['GIDA Compare: 2 Model, Capex + Parts + BBM','GIDA Compare: 2 Models, Capex + Parts + Fuel'],

 n_common:['Watt lampu, cuaca, DOD, genset, jam kerja, horizon, dan harga solar dipakai sama oleh kedua model. Yang berbeda: spesifikasi (PV, baterai), harga unit, dan daftar parts.','Lamp watt, weather, DOD, genset, working hours, horizon and diesel price are identical for both models. What differs: specification (PV, battery), unit price and parts list.'],
 l_lamp:['Total watt lampu (W)','Total lamp watt (W)'],l_ph:['Horizon: jam lampu menyala','Horizon: lamp-on hours'],l_weather:['Cuaca (PSH)','Weather (PSH)'],
 l_dod:['DOD (%)','DOD (%)'],l_gmode:['Genset berhenti di','Genset stops at'],l_gpct:['Genset mati di SOC (%)','Genset stops at SOC (%)'],l_gpath:['Jalur daya genset','Genset power path'],
 l_pre:['Precharge siang','Daytime precharge'],l_bal:['Balancing tiap N hari (0 = off)','Balancing every N days (0 = off)'],l_wdays:['Hari kerja per tahun','Working days per year'],
 l_s1:['Lampu mulai jam','Lamp on at hour'],l_s2:['Jam lampu menyala per malam','Lamp hours per night'],l_fuel:['Harga solar (Rp/L)','Diesel price (Rp/L)'],l_inv:['Efisiensi inverter (%)','Inverter efficiency (%)'],l_deg:['Degradasi baterai','Battery degradation'],
 o_pct:['SOC custom %','Custom SOC %'],o_full:['Full 100%','Full 100%'],o_cont:['Jalan terus sampai shift selesai','Run until shift ends'],o_ginv:['Semua via inverter','All via inverter'],o_gbyp:['Bypass','Bypass'],o_on:['Aktif','On'],o_off:['Mati','Off'],
 w_gelap:['Gelap gulita / badai (PSH 0)','Dark / storm (PSH 0)'],w_mendung:['Mendung / hujan (PSH 1,5)','Overcast / rain (PSH 1.5)'],w_berawan:['Berawan sebagian (PSH 3,0)','Partly cloudy (PSH 3.0)'],w_cerah:['Cerah (PSH 4,5)','Sunny (PSH 4.5)'],
 h_a:['Model A','Model A'],h_b:['Model B','Model B'],l_model:['Model','Model'],l_capex:['Harga unit / capex (Rp)','Unit price / capex (Rp)'],
 ui_drop:['Klik atau seret file parts (.xlsx) untuk model ini','Click or drop the parts file (.xlsx) for this model'],ui_tpl:['Unduh template parts','Download parts template'],
 btn_run:['Bandingkan','Compare'],btn_xls:['Ekspor Excel','Export Excel'],calc:['Menghitung...','Calculating...'],
 u_hpy:['{d} hari × {h} jam = {y} jam lampu per tahun','{d} days × {h} h = {y} lamp hours per year'],
 h_kpi:['Perbandingan di horizon','Comparison at the horizon'],h_chart:['Biaya kumulatif: capex + parts + BBM','Cumulative cost: capex + parts + fuel'],h_year:['Biaya kumulatif per tahun','Cumulative cost by year'],h_cat:['Rincian parts per kategori (total di horizon)','Parts by category (total over the horizon)'],
 n_foot:['Harga parts = harga jual apa adanya dari file. Baris berstatus "Asumsi" belum resmi. BBM dihitung dari simulasi 5 menit (sama dengan Cash Out v5).','Part prices are taken as-is from the file. Rows marked "Asumsi" are not official. Fuel comes from the 5-minute simulation (same as Cash Out v5).'],
 h_tech:['Teknis di horizon (hasil simulasi 5 menit)','Technical at the horizon (5-minute simulation)'],
 k_pva:['PV tersedia (kWh)','PV available (kWh)'],k_pvu:['PV terpakai (%)','PV utilised (%)'],k_pvw:['PV terbuang karena baterai penuh (kWh)','PV curtailed, battery full (kWh)'],
 k_soh:['SOH baterai di akhir horizon','Battery SOH at the end of the horizon'],k_capk:['Kapasitas baterai di akhir (kWh)','Battery capacity at the end (kWh)'],k_efc:['Siklus setara penuh (energi lampu ÷ kapasitas)','Equivalent full cycles (lamp energy ÷ capacity)'],
 n_tech:['PV terpakai = PV tersedia dikurangi PV yang terbuang karena baterai penuh (sampai akhir shift terakhir). SOH di model ini turun linear per jam lampu menurut tabel DOD, sama untuk semua ukuran baterai; siklus setara ditampilkan sebagai indikator beban baterai (baterai lebih kecil = lebih banyak siklus).','PV utilised = PV available minus PV curtailed because the battery was full (until the end of the last shift). SOH in this model falls linearly per lamp hour from the DOD table, the same for every battery size; equivalent cycles are shown as an indicator of battery load (smaller battery = more cycles).'],
 k_item:['Item','Item'],k_diff:['Selisih (B − A)','Difference (B − A)'],
 k_capex:['Harga unit (capex)','Unit price (capex)'],k_parts:['Parts (di horizon)','Parts (over horizon)'],k_liters:['BBM (liter)','Fuel (liters)'],k_bbm:['BBM (Rp)','Fuel (Rp)'],k_ops:['Total operasional (parts + BBM)','Operating total (parts + fuel)'],
 k_tot:['Total owning & operating','Total owning & operating'],k_perhr:['Biaya per jam lampu (Rp)','Cost per lamp hour (Rp)'],k_gen:['Jam genset total','Total genset hours'],k_starts:['Jam lampu di horizon','Lamp hours in horizon'],
 y_label:['Tahun {y}','Year {y}'],y_hrs:['s/d jam {h}','to hour {h}'],y_opA:['Operasional A','Operating A'],y_opB:['Operasional B','Operating B'],y_cumA:['Kumulatif A','Cumulative A'],y_cumB:['Kumulatif B','Cumulative B'],y_diff:['Selisih (B − A)','Diff (B − A)'],
 cat_h:['Kategori','Category'],
 v_cross:['{lo} lebih mahal di awal (selisih capex Rp {dc} juta dibanding {hi}), tetapi menjadi lebih murah mulai sekitar jam lampu ke-{h} (± {y} tahun operasi). Di horizon {H} jam, {lo} lebih hemat Rp {d} juta.','{lo} costs more upfront (capex gap Rp {dc} million versus {hi}), but becomes cheaper from about lamp hour {h} (≈ {y} years of operation). At the {H}-hour horizon, {lo} saves Rp {d} million.'],
 v_nocross:['Tidak ada titik potong dalam horizon {H} jam: {lo} lebih murah di seluruh horizon (selisih akhir Rp {d} juta). Perpanjang horizon bila ingin melihat apakah ada titik potong.','No break-even within the {H}-hour horizon: {lo} stays cheaper throughout (final gap Rp {d} million). Extend the horizon to see whether a break-even appears.'],
 v_equal:['Total biaya kedua model sama di horizon ini.','Total cost of both models is equal at this horizon.'],
 v_note:['Bila titik potong muncul lebih dari satu kali (karena penggantian parts bersifat melompat), yang disebut adalah yang pertama.','If the curves cross more than once (parts replacements are step-wise), the first crossing is reported.'],
 be_lbl:['Titik potong ≈ jam {h}','Break-even ≈ hour {h}'],
 w_lim:['Watt lampu melebihi kapasitas jalur daya (inverter 3.600 W / bypass 5.000 W).','Lamp watt exceeds the power-path capacity (inverter 3,600 W / bypass 5,000 W).'],
 w_gap:['{m}: baterai + genset tidak mampu menyuplai lampu sepenuhnya (kekurangan energi {w} Wh). Hasil model ini tidak apple to apple.','{m}: battery + genset cannot fully supply the lamp (energy shortfall {w} Wh). This model is not an apples-to-apples result.'],
 w_assume:['{m}: {a} dari {n} item parts berstatus "Asumsi".','{m}: {a} of {n} part items are marked "Asumsi".'],
 w_samemodel:['Model A dan B sama; yang dibandingkan hanya harga unit dan daftar parts.','Models A and B are the same; only unit price and parts list differ.'],
 w_inputs:['Periksa input: jam per malam 1–24, hari kerja 1–365, jam horizon > 0, DOD 50–100, watt lampu > 0.','Check the inputs: hours per night 1–24, working days 1–365, horizon > 0, DOD 50–100, lamp watt > 0.'],
 w_need:['Upload file parts untuk Model A dan Model B terlebih dahulu.','Upload the parts file for both Model A and Model B first.'],
 sel:['Model A','Model A'],
 xl_cmp:['Perbandingan','Comparison'],xl_as:['Asumsi','Assumptions']
};
const UI=i=>LANG==='id'?0:1;
const U=(k,a)=>{let s=(UD[k]||[k,k])[UI()];if(a)s=s.replace(/\{(\w+)\}/g,(m,x)=>a[x]!==undefined?a[x]:m);return s};
const T=(k,a)=>GIDA.tr(LANG,k,a);
const loc=LANG=>LANG==='id'||LANG==='es'?'de-DE':'en-US';
const nf=n=>Math.round(n).toLocaleString(loc(LANG));
const dec=(n,d)=>n.toLocaleString(loc(LANG),{minimumFractionDigits:d,maximumFractionDigits:d});
const jt=n=>dec(n/1e6,2);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const em=e=>(e.row&&e.row>0?T('p_row',{r:e.row}):'')+esc(T(e.k,e.a));
const sumA=a=>a.reduce((x,y)=>x+y,0);
const SIDES=['A','B'];
const ST={A:null,B:null};let LAST=null;
SIDES.forEach(s=>{Object.keys(GIDA.SPECS).forEach(m=>$('m'+s).add(new Option(m,m)))});
$('mA').value='GD9-M';$('mB').value='GD9-H';
GIDA.WEATHER.forEach(w=>$('weather').add(new Option('',w.id)));$('weather').value='mendung';
const syncCapex=s=>{$('c'+s).value=GIDA.SPECS[$('m'+s).value].price};
SIDES.forEach(s=>{syncCapex(s);$('m'+s).onchange=()=>{syncCapex(s);revalidate(s)}});
$('gmode').onchange=()=>{$('gpctBox').style.display=$('gmode').value==='pct'?'':'none'};
function shiftOf(){const h=+$('nHours').value;return h>=1&&h<=24?h:12}
function updHpy(){const d=+$('wdays').value,h=shiftOf();$('hpyShow').textContent=U('u_hpy',{d:nf(d),h:+h.toFixed(2),y:nf(d*h)})}
['wdays','nHours'].forEach(id=>$(id).addEventListener('input',updHpy));

function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-u]').forEach(el=>{el.textContent=U(el.dataset.u)});
  [...$('weather').options].forEach(o=>{o.textContent=U('w_'+o.value)});
  document.title=U('title');$('lang').value=LANG;updHpy();
  SIDES.forEach(s=>{if(ST[s]&&ST[s].res)showMsgs(s)});
  if(LAST)render();
}
$('lang').onchange=()=>{LANG=$('lang').value;try{localStorage.setItem('gida_lang',LANG)}catch(e){};applyLang()};

function showMsgs(s){
  const r=ST[s].res;let h='';
  if(r.errors.length){h+='<div class="msg e"><b>'+T('p_errs',{n:r.errors.length})+'</b><ul>'+r.errors.slice(0,15).map(e=>'<li>'+em(e)+'</li>').join('')+(r.errors.length>15?'<li>'+T('p_more',{n:r.errors.length-15})+'</li>':'')+'</ul></div>'}
  else{h+='<div class="msg o">'+esc(T('p_ok',{m:r.meta.model,n:r.meta.nActive}))+(r.meta.versi?esc(T('p_ver',{v:r.meta.versi})):'')+esc(r.meta.nAsumsi?T('p_asm',{n:r.meta.nAsumsi}):T('p_allres'))+'</div>'}
  if(r.warnings.length)h+='<div class="msg w"><ul>'+r.warnings.slice(0,6).map(e=>'<li>'+em(e)+'</li>').join('')+'</ul></div>';
  $('msg'+s).innerHTML=h;
}
function refreshRun(){$('btnRun').disabled=!(SIDES.every(s=>ST[s]&&ST[s].res&&!ST[s].res.errors.length))}
function revalidate(s){
  if(!ST[s])return;
  const r=GIDA.parsePartsRows(ST[s].rows,$('m'+s).value,0);
  ST[s].res=r;showMsgs(s);refreshRun();
  if(r.errors.length){$('btnXls').disabled=true}
}
async function loadFile(s,f){
  $('fname'+s).textContent=f.name;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const sn=wb.SheetNames.includes('Parts')?'Parts':wb.SheetNames[0];
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null,raw:true});
    ST[s]={rows};
    const p0=GIDA.parsePartsRows(rows,null,0);
    if(p0.meta.model&&GIDA.SPECS[p0.meta.model]&&!p0.errors.length){$('m'+s).value=p0.meta.model;syncCapex(s)}
    revalidate(s);
  }catch(e){ST[s]=null;$('msg'+s).innerHTML='<div class="msg e">'+esc(T('p_unread',{m:e.message}))+'</div>';refreshRun()}
}
SIDES.forEach(s=>{
  $('drop'+s).onclick=()=>$('file'+s).click();
  $('file'+s).onchange=e=>e.target.files[0]&&loadFile(s,e.target.files[0]);
  $('drop'+s).ondragover=e=>{e.preventDefault();$('drop'+s).classList.add('on')};
  $('drop'+s).ondragleave=()=>$('drop'+s).classList.remove('on');
  $('drop'+s).ondrop=e=>{e.preventDefault();$('drop'+s).classList.remove('on');e.dataTransfer.files[0]&&loadFile(s,e.dataTransfer.files[0])};
});
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
$('btnTpl').onclick=async()=>{const b=await GIDA.buildTemplate(ExcelJS,LANG).xlsx.writeBuffer();save(new Blob([b]),'GIDA_PartsList_template.xlsx')};

function params(s){
  const m=$('m'+s).value,dod=+$('dod').value,wid=$('weather').value,w=GIDA.WEATHER.find(x=>x.id===wid);
  const cx=$('c'+s).value;
  return {model:m,lamp:+$('lamp').value,psh:w.psh,weatherLabel:U('w_'+wid),sStart:+$('sStart').value,sStop:(((+$('sStart').value+shiftOf())%24)+24)%24,dod,
    preHour:15,preOn:$('pre').value==='1',chEff:90,pvEff:80,invEff:+$('inv').value,bal:+$('bal').value||0,gMode:$('gmode').value,gPath:$('gpath').value,gPct:+$('gpct').value,
    degr:$('degr').value==='1',degPerYear:GIDA.degPerYear(dod),workDays:+$('wdays').value,hoursPerYear:+$('wdays').value*shiftOf(),projectHours:+$('ph').value,
    fuelPrice:+$('fuel').value,capex:(cx!==''&&+cx>=0?+cx:GIDA.SPECS[m].price)};
}
function totalsCurve(parts,res,p,n){
  const cu=GIDA.cumulative(parts,res,p,n);
  const tot=cu.xs.map((x,i)=>p.capex+sumA(cu.series.map(s=>s.vals[i])));
  return {xs:cu.xs,tot};
}
function findCross(xs,dA,dB){
  // d = B - A; cari perubahan tanda pertama setelah jam 0
  const d=xs.map((x,i)=>dB[i]-dA[i]);
  for(let i=1;i<xs.length;i++){
    const a=d[i-1],b=d[i];
    if(a===0&&i>1)return xs[i-1];
    if((a<0&&b>0)||(a>0&&b<0)){const t=a/(a-b);return xs[i-1]+t*(xs[i]-xs[i-1])}
    if(b===0&&a!==0)return xs[i];
  }
  return null;
}
$('btnRun').onclick=()=>{
  const pA=params('A'),pB=params('B');
  if(!(+$('nHours').value>=1&&+$('nHours').value<=24&&pA.workDays>=1&&pA.workDays<=365&&pA.hoursPerYear>0&&pA.projectHours>0&&pA.dod>=50&&pA.dod<=100&&pA.lamp>0)){alert(U('w_inputs'));return}
  if(!SIDES.every(s=>ST[s]&&ST[s].res&&!ST[s].res.errors.length)){alert(U('w_need'));return}
  $('runInfo').textContent=U('calc');
  setTimeout(()=>{
    const out={};
    [['A',pA],['B',pB]].forEach(([s,p])=>{
      const parts=ST[s].res.parts,res=GIDA.compute(parts,p);
      const curve=totalsCurve(parts,res,p,600);
      out[s]={s,p,parts,res,meta:ST[s].res.meta,curve};
    });
    const xs=out.A.curve.xs;
    out.cross=findCross(xs,out.A.curve.tot,out.B.curve.tot);
    LAST=out;render();$('btnXls').disabled=false;$('runInfo').textContent='';
  },30);
};
const nm=s=>LAST[s].p.model+' ('+s+')';
function render(){
  const A=LAST.A,B=LAST.B,pA=A.p,H=pA.projectHours;
  $('out').classList.remove('hide');
  $('ttl').textContent=nm('A')+'  vs  '+nm('B')+' · '+U('w_'+$('weather').value).split(' (')[0]+' · DOD '+pA.dod+'% · '+pA.lamp+' W · '+nf(H)+' h';
  const tot=s=>{const L=LAST[s],r=L.res;const parts=sumA(r.co.partsTot),bbm=sumA(r.bbmRp),ltr=sumA(r.bbmL);const sm=r.sim,pa=sm.pvAvail,pw=sm.pvWaste,bat=GIDA.SPECS[L.p.model].bat,soh=L.p.degr?Math.max(0.3,1-L.p.degPerYear*H/L.p.hoursPerYear):1;return {capex:L.p.capex,parts,bbm,ltr,ops:parts+bbm,all:L.p.capex+parts+bbm,perhr:(L.p.capex+parts+bbm)/H,gen:r.buckets[r.buckets.length-1].genCum,pva:pa/1000,pvw:pw/1000,pvu:pa>0?(pa-pw)/pa*100:NaN,soh:soh*100,capk:bat*soh/1000,efc:sm.lampBat*H/bat}};
  const tA=tot('A'),tB=tot('B');
  // Verdict
  const dEnd=tB.all-tA.all,d0=B.p.capex-A.p.capex;
  let v='';
  if(Math.abs(dEnd)<1e-6)v=U('v_equal');
  else{
    const lo=dEnd<0?'B':'A',hi=lo==='B'?'A':'B';
    if(LAST.cross!==null&&Math.sign(d0)!==Math.sign(dEnd)&&d0!==0){
      v=U('v_cross',{hi:nm(hi),lo:nm(lo),dc:jt(Math.abs(d0)),h:nf(LAST.cross),y:dec(LAST.cross/pA.hoursPerYear,1),H:nf(H),d:jt(Math.abs(dEnd))})+' <span class="mut" style="font-weight:400;font-size:.78rem">'+esc(U('v_note'))+'</span>';
    }else v=U('v_nocross',{lo:nm(lo),H:nf(H),d:jt(Math.abs(dEnd))});
  }
  $('verdict').innerHTML=v;
  // Warnings
  let w='';
  if(pA.model===pB_model())w+='<div class="msg w">'+esc(U('w_samemodel'))+'</div>';
  if(pA.lamp>(pA.gPath==='bypass'?GIDA.GEN_RATED_W:GIDA.INV_RATED_W))w+='<div class="msg w">'+esc(U('w_lim'))+'</div>';
  SIDES.forEach(s=>{const L=LAST[s];
    if(L.res.sim.lampGapWh>1)w+='<div class="msg w">'+esc(U('w_gap',{m:nm(s),w:nf(L.res.sim.lampGapWh)}))+'</div>';
    if(L.meta.nAsumsi)w+='<div class="msg w">'+esc(U('w_assume',{m:nm(s),a:L.meta.nAsumsi,n:L.meta.nActive}))+'</div>'});
  $('warn').innerHTML=w;
  // KPI table
  const rp=v=>'Rp '+jt(v)+' '+T('k_mil');
  const rows=[
    ['k_capex',tA.capex,tB.capex,rp],['k_parts',tA.parts,tB.parts,rp],['k_liters',tA.ltr,tB.ltr,v=>nf(v)+' L'],['k_bbm',tA.bbm,tB.bbm,rp],['k_ops',tA.ops,tB.ops,rp],
    ['k_tot',tA.all,tB.all,rp,true],['k_perhr',tA.perhr,tB.perhr,v=>'Rp '+nf(v),true],['k_gen',tA.gen,tB.gen,v=>nf(v)+' '+T('u_hr')],
    ['h_tech'],
    ['k_pva',tA.pva,tB.pva,v=>nf(v)+' kWh',false,0],['k_pvu',tA.pvu,tB.pvu,v=>isFinite(v)?dec(v,1)+' %':'–',false,1],['k_pvw',tA.pvw,tB.pvw,v=>nf(v)+' kWh',false,-1],
    ['k_soh',tA.soh,tB.soh,v=>dec(v,1)+' %',false,1],['k_capk',tA.capk,tB.capk,v=>dec(v,2)+' kWh',false,1],['k_efc',tA.efc,tB.efc,v=>nf(v),false,-1]];
  let h='<table><thead><tr><th>'+U('k_item')+'</th><th class="ha">'+esc(nm('A'))+'</th><th class="hb">'+esc(nm('B'))+'</th><th>'+U('k_diff')+'</th></tr></thead><tbody>';
  rows.forEach(([k,a,b,f,bold,dir])=>{
    if(k==='h_tech'){h+='<tr class="sec"><td colspan="4">'+U('h_tech')+'</td></tr>';return}
    const d=b-a;const dr=dir===undefined?-1:dir;const cls=!isFinite(d)||Math.abs(d)<1e-9||dr===0?'':((d*dr)>0?'good':'badc');
    const dtxt=!isFinite(d)?'–':(d>0?'+':d<0?'−':'')+f(Math.abs(d));
    h+='<tr'+(bold?' class="tot"':'')+'><td>'+U(k)+'</td><td class="n">'+f(a)+'</td><td class="n">'+f(b)+'</td><td class="n '+cls+'">'+dtxt+'</td></tr>'});
  $('kpi').innerHTML=h+'</tbody></table><p class="mut" style="margin:10px 0 0">'+esc(U('n_tech'))+'</p>';
  // Yearly table
  const nB=A.res.buckets.length;
  let hh='<table><thead><tr><th>'+U('y_label',{y:''}).trim()+'</th><th>'+U('y_hrs',{h:''}).trim()+'</th><th class="ha">'+U('y_opA')+'</th><th class="hb">'+U('y_opB')+'</th><th class="ha">'+U('y_cumA')+'</th><th class="hb">'+U('y_cumB')+'</th><th>'+U('y_diff')+'</th></tr></thead><tbody>';
  let cA=A.p.capex,cB=B.p.capex;
  hh+='<tr class="sec"><td colspan="2">'+U('k_capex')+'</td><td></td><td></td><td class="n">'+nf(cA)+'</td><td class="n">'+nf(cB)+'</td><td class="n">'+sgn(cB-cA)+'</td></tr>';
  for(let i=0;i<nB;i++){cA+=A.res.total[i];cB+=B.res.total[i];const d=cB-cA;
    hh+='<tr><td>'+U('y_label',{y:A.res.buckets[i].y})+'</td><td class="n">'+nf(A.res.buckets[i].hi)+'</td><td class="n">'+nf(A.res.total[i])+'</td><td class="n">'+nf(B.res.total[i])+'</td><td class="n">'+nf(cA)+'</td><td class="n">'+nf(cB)+'</td><td class="n '+(d<0?'good':d>0?'badc':'')+'">'+sgn(d)+'</td></tr>'}
  $('yearTbl').innerHTML=hh+'</tbody></table>';
  // Categories
  const cats=[];SIDES.forEach(s=>LAST[s].res.co.groups.forEach(g=>{if(!cats.includes(g.kategori))cats.push(g.kategori)}));
  const catSum=(s,k)=>{const g=LAST[s].res.co.groups.find(x=>x.kategori===k);return g?sumA(g.sub):0};
  let ch='<table><thead><tr><th>'+U('cat_h')+'</th><th class="ha">'+esc(nm('A'))+'</th><th class="hb">'+esc(nm('B'))+'</th><th>'+U('k_diff')+'</th></tr></thead><tbody>';
  cats.forEach(k=>{const a=catSum('A',k),b=catSum('B',k),d=b-a;ch+='<tr><td>'+esc(k)+'</td><td class="n">'+nf(a)+'</td><td class="n">'+nf(b)+'</td><td class="n '+(d<0?'good':d>0?'badc':'')+'">'+sgn(d)+'</td></tr>'});
  ch+='<tr class="tot"><td>'+U('k_parts')+'</td><td class="n">'+nf(tA.parts)+'</td><td class="n">'+nf(tB.parts)+'</td><td class="n">'+sgn(tB.parts-tA.parts)+'</td></tr>';
  $('catTbl').innerHTML=ch+'</tbody></table>';
  $('chart').innerHTML=chartSvg();
}
function pB_model(){return LAST.B.p.model}
function sgn(d){return (d>0?'+':d<0?'−':'')+nf(Math.abs(d))}
function niceStep(max,n){const raw=max/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function chartSvg(){
  const A=LAST.A,B=LAST.B,xs=A.curve.xs,H=xs[xs.length-1];
  const W=900,HT=360,m={l:64,r:18,t:28,b:44},iw=W-m.l-m.r,ih=HT-m.t-m.b;
  const allv=A.curve.tot.concat(B.curve.tot);const mx=Math.max(...allv),mn=Math.min(...allv);
  const lo0=Math.max(0,Math.floor(mn*0.8/1e8)*1e8);
  const step=niceStep((mx-lo0),5),top=Math.ceil(mx/step)*step,bot=Math.floor(lo0/step)*step;
  const X=x=>m.l+x/H*iw,Y=v=>m.t+ih-(v-bot)/(top-bot)*ih;
  const col={t:'var(--muted)',g:'var(--border)'};
  let s='<div class="lg"><span><i style="background:#38bdf8"></i>'+esc(nm('A'))+'</span><span><i style="background:#f97316"></i>'+esc(nm('B'))+'</span></div>';
  s+='<svg viewBox="0 0 '+W+' '+HT+'" role="img">';
  for(let v=bot;v<=top+1e-6;v+=step){const y=Y(v);s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y+'" y2="'+y+'" stroke="'+col.g+'" stroke-width="1"/><text x="'+(m.l-8)+'" y="'+(y+4)+'" text-anchor="end" style="fill:'+col.t+';font-size:11px">'+dec(v/1e6,0)+'</text>'}
  s+='<text x="'+(m.l-8)+'" y="12" text-anchor="end" style="fill:'+col.t+';font-size:11px">Rp '+(LANG==='id'?'juta':'million')+'</text>';
  const nx=6;for(let i=0;i<=nx;i++){const h=H*i/nx;s+='<text x="'+X(h)+'" y="'+(HT-m.b+18)+'" text-anchor="middle" style="fill:'+col.t+';font-size:11px">'+nf(h)+'</text>'}
  s+='<text x="'+(m.l+iw/2)+'" y="'+(HT-6)+'" text-anchor="middle" style="fill:'+col.t+';font-size:11px">'+esc(T('b_lamp'))+'</text>';
  const line=(c,color)=>'<polyline fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" points="'+xs.map((x,i)=>X(x).toFixed(1)+','+Y(c[i]).toFixed(1)).join(' ')+'"/>';
  s+=line(A.curve.tot,'#38bdf8')+line(B.curve.tot,'#f97316');
  const d0=B.p.capex-A.p.capex,dEnd=B.curve.tot[B.curve.tot.length-1]-A.curve.tot[A.curve.tot.length-1];
  if(LAST.cross!==null&&d0!==0&&Math.sign(d0)!==Math.sign(dEnd)){
    const x=X(LAST.cross);s+='<line x1="'+x+'" x2="'+x+'" y1="'+m.t+'" y2="'+(m.t+ih)+'" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5 4"/>';
    const anchor=x>W*0.7?'end':'start';s+='<text x="'+(x+(anchor==='end'?-6:6))+'" y="'+(m.t+14)+'" text-anchor="'+anchor+'" style="fill:#22c55e;font-size:12px;font-weight:600">'+esc(U('be_lbl',{h:nf(LAST.cross)}))+'</text>';
  }
  return s+'</svg>';
}

/* ---------- Ekspor Excel (kapital, harga solar, parts hidup via rumus) ---------- */
function buildCompareWorkbook(){
  const A=LAST.A,B=LAST.B,p=A.p,lang=LANG,L=(k,a)=>U(k,a);
  const wb=new ExcelJS.Workbook();
  const thin={style:'thin',color:{argb:'FFBFBFBF'}},border={top:thin,left:thin,bottom:thin,right:thin};
  const f=(o)=>Object.assign({name:'Arial',size:10},o||{});
  const BLUE=f({color:{argb:'FF0000FF'}}),BOLD=f({bold:true}),NOTE=f({italic:true,color:{argb:'FF595959'}}),GRN=f({color:{argb:'FF006100'}});
  const HDR={type:'pattern',pattern:'solid',fgColor:{argb:'FF1F4E78'}},HDA={type:'pattern',pattern:'solid',fgColor:{argb:'FF1C6F99'}},HDB={type:'pattern',pattern:'solid',fgColor:{argb:'FFB3541A'}};
  const SUB={type:'pattern',pattern:'solid',fgColor:{argb:'FFDDEBF7'}},TOT={type:'pattern',pattern:'solid',fgColor:{argb:'FFE2EFDA'}};
  const RP='#,##0';
  const put=(ws,ref,v,font,fmt,fill,al)=>{const c=ws.getCell(ref);c.value=v;c.font=font||f();if(fmt)c.numFmt=fmt;if(fill)c.fill=fill;if(al)c.alignment=al;c.border=border;return c};
  const colL=n=>{let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-m)/26)}return s};
  const F=(formula,result)=>({formula,result});
  const nmA=L('xl_cmp'),nmAs=L('xl_as');
  const wsC=wb.addWorksheet(nmA),wsS=wb.addWorksheet(nmAs),wsPA=wb.addWorksheet('Parts A'),wsPB=wb.addWorksheet('Parts B');
  [wsC,wsS,wsPA,wsPB].forEach(w=>{w.views=[{showGridLines:false}];w.pageSetup={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0}});
  const AS="'"+nmAs+"'!";
  const nB=A.res.buckets.length;
  /* --- Asumsi --- */
  wsS.getCell('A1').value='GIDA Compare: '+A.p.model+' (A) vs '+B.p.model+' (B)';wsS.getCell('A1').font=f({bold:true,size:14});
  wsS.getCell('A2').value=lang==='id'?'Biru = input. Yang aktif di rumus: harga unit A/B dan harga solar. Parameter simulasi lain hanya catatan; ubah di web lalu ekspor ulang.':'Blue = input. Active in formulas: unit price A/B and diesel price. Other simulation parameters are notes only; change them in the web app and export again.';
  wsS.getCell('A2').font=NOTE;
  ['Parameter','Nilai','Keterangan'].forEach((h,i)=>{const c=wsS.getCell(3,i+1);c.value=h;c.font=f({bold:true,color:{argb:'FFFFFFFF'}});c.fill=HDR;c.border=border;c.alignment={horizontal:'center'}});
  const row=(r,a,v,font,fmt,note)=>{put(wsS,'A'+r,a);put(wsS,'B'+r,v,font||BLUE,fmt,null,{horizontal:'right'});put(wsS,'C'+r,note||'',NOTE)};
  const gTxt=p.gMode==='pct'?p.gPct/100:(p.gMode==='full'?U('o_full'):U('o_cont'));
  row(4,'Model A',A.p.model,BLUE);row(5,'Model B',B.p.model,BLUE);
  row(6,lang==='id'?'Harga unit A (capex)':'Unit price A (capex)',A.p.capex,BLUE,RP,'Rp');
  row(7,lang==='id'?'Harga unit B (capex)':'Unit price B (capex)',B.p.capex,BLUE,RP,'Rp');
  row(8,U('l_fuel'),p.fuelPrice,BLUE,RP,'Rp/L');
  row(9,U('l_ph'),p.projectHours,BLUE,RP,'h');
  row(10,lang==='id'?'Jam lampu per tahun':'Lamp hours per year',p.hoursPerYear,BLUE,RP,'h');
  row(11,U('l_lamp'),p.lamp,BLUE,RP,'W');
  row(12,U('l_weather'),U('w_'+$('weather').value),BLUE);
  row(13,'DOD',p.dod/100,BLUE,'0%');
  row(14,U('l_gmode'),gTxt,BLUE,typeof gTxt==='number'?'0%':undefined);
  row(15,U('l_gpath'),p.gPath==='bypass'?U('o_gbyp'):U('o_ginv'),BLUE);
  row(16,U('l_bal'),p.bal,BLUE,'0');
  row(17,U('l_s2'),shiftOf(),BLUE,'0.0','h');
  row(18,U('l_wdays'),p.workDays,BLUE,'0');
  row(19,U('l_inv'),p.invEff/100,BLUE,'0%');
  row(20,U('l_deg'),p.degr?U('o_on'):U('o_off'),BLUE);
  row(21,lang==='id'?'Konsumsi genset (L/jam)':'Genset fuel burn (L/h)',GIDA.FUEL_LPH,BLUE,'0.000','L/h');
  wsS.columns=[{width:34},{width:22},{width:70}];
  /* --- Parts sheets --- */
  const partsSheet=(ws,L_,title)=>{
    ws.getCell('A1').value=title;ws.getCell('A1').font=f({bold:true,size:14});
    ws.getCell('A2').value=lang==='id'?'Biaya penggantian per tahun hasil simulasi web (nilai). Total per tahun memakai rumus SUM.':'Replacement cost per year from the web simulation (values). Yearly totals use SUM formulas.';ws.getCell('A2').font=NOTE;
    const hd=['Part No',T('t_comp'),T('t_qty'),T('t_price')];
    hd.forEach((h,i)=>{const c=ws.getCell(4,i+1);c.value=h;c.font=f({bold:true,color:{argb:'FFFFFFFF'}});c.fill=HDR;c.border=border;c.alignment={horizontal:'center',wrapText:true}});
    for(let i=0;i<nB;i++){const c=ws.getCell(4,5+i);c.value=U('y_label',{y:i+1});c.font=f({bold:true,color:{argb:'FFFFFFFF'}});c.fill=HDR;c.border=border;c.alignment={horizontal:'center'}}
    const tc=ws.getCell(4,5+nB);tc.value=T('t_total');tc.font=f({bold:true,color:{argb:'FFFFFFFF'}});tc.fill=HDR;tc.border=border;tc.alignment={horizontal:'center'};
    let r=5;const first=r;
    for(const g of L_.res.co.groups){
      for(const x of g.rows){
        put(ws,'A'+r,x.part.partNo);put(ws,'B'+r,x.part.komponen);put(ws,'C'+r,x.part.qty,f(),'0');put(ws,'D'+r,x.unit,f(),RP);
        x.costs.forEach((v,i)=>put(ws,colL(5+i)+r,v,f(),RP));
        put(ws,colL(5+nB)+r,F('SUM('+colL(5)+r+':'+colL(4+nB)+r+')',x.total),f(),RP);r++;
      }
    }
    const last=r-1;
    put(ws,'A'+r,T('c_tp'),BOLD,null,TOT);['B','C','D'].forEach(c=>put(ws,c+r,null,f(),null,TOT));
    for(let i=0;i<=nB;i++){const cl=colL(5+i);put(ws,cl+r,F(last>=first?'SUM('+cl+first+':'+cl+last+')':'0',i<nB?L_.res.co.partsTot[i]:sumA(L_.res.co.partsTot)),BOLD,RP,TOT)}
    ws.columns=[{width:14},{width:38},{width:8},{width:14}].concat(Array.from({length:nB+1},()=>({width:15})));
    ws.views=[{state:'frozen',xSplit:4,ySplit:4,showGridLines:false}];
    return r;
  };
  const totA=partsSheet(wsPA,A,'Parts A: '+A.p.model),totB=partsSheet(wsPB,B,'Parts B: '+B.p.model);
  /* --- Perbandingan --- */
  const w=wsC;
  w.getCell('A1').value='GIDA Compare: '+A.p.model+' (A) vs '+B.p.model+' (B)';w.getCell('A1').font=f({bold:true,size:14});
  w.getCell('A2').value=$('verdict').textContent;w.getCell('A2').font=NOTE;
  const H0=5;
  const heads=[['A','B'].map(x=>x),null];
  const labels=['',''];
  const hd=[[1,lang==='id'?'Tahun':'Year',HDR],[2,lang==='id'?'Jam lampu (akhir)':'Lamp hours (end)',HDR],
    [3,'A: '+(lang==='id'?'Liter BBM':'Fuel liters'),HDA],[4,'A: BBM (Rp)',HDA],[5,'A: Parts (Rp)',HDA],[6,'A: '+(lang==='id'?'Operasional':'Operating'),HDA],[7,'A: '+(lang==='id'?'Kumulatif + capex':'Cumulative + capex'),HDA],
    [8,'B: '+(lang==='id'?'Liter BBM':'Fuel liters'),HDB],[9,'B: BBM (Rp)',HDB],[10,'B: Parts (Rp)',HDB],[11,'B: '+(lang==='id'?'Operasional':'Operating'),HDB],[12,'B: '+(lang==='id'?'Kumulatif + capex':'Cumulative + capex'),HDB],
    [13,lang==='id'?'Selisih kumulatif (B − A)':'Cumulative diff (B − A)',HDR]];
  hd.forEach(([c,t,fill])=>{const cell=w.getCell(H0-1,c);cell.value=t;cell.font=f({bold:true,color:{argb:'FFFFFFFF'}});cell.fill=fill;cell.border=border;cell.alignment={horizontal:'center',vertical:'middle',wrapText:true}});
  w.getRow(H0-1).height=34;
  let cumA=A.p.capex,cumB=B.p.capex;
  for(let i=0;i<nB;i++){
    const r=H0+i,pc=colL(5+i);
    put(w,'A'+r,i+1,f(),'0');put(w,'B'+r,A.res.buckets[i].hi,f(),RP);
    put(w,'C'+r,A.res.bbmL[i],f(),'#,##0.0');put(w,'D'+r,F('C'+r+'*'+AS+'$B$8',A.res.bbmRp[i]),GRN,RP);put(w,'E'+r,F("'Parts A'!"+pc+totA,A.res.co.partsTot[i]),GRN,RP);put(w,'F'+r,F('D'+r+'+E'+r,A.res.total[i]),f(),RP);
    cumA+=A.res.total[i];put(w,'G'+r,F((i===0?AS+'$B$6+F'+r:'G'+(r-1)+'+F'+r),cumA),BOLD,RP);
    put(w,'H'+r,B.res.bbmL[i],f(),'#,##0.0');put(w,'I'+r,F('H'+r+'*'+AS+'$B$8',B.res.bbmRp[i]),GRN,RP);put(w,'J'+r,F("'Parts B'!"+pc+totB,B.res.co.partsTot[i]),GRN,RP);put(w,'K'+r,F('I'+r+'+J'+r,B.res.total[i]),f(),RP);
    cumB+=B.res.total[i];put(w,'L'+r,F((i===0?AS+'$B$7+K'+r:'L'+(r-1)+'+K'+r),cumB),BOLD,RP);
    put(w,'M'+r,F('L'+r+'-G'+r,cumB-cumA),BOLD,RP);
  }
  const rl=H0+nB-1,rt=rl+1;
  put(w,'A'+rt,lang==='id'?'Total':'Total',BOLD,null,TOT);put(w,'B'+rt,null,f(),null,TOT);
  [['C','#,##0.0',sumA(A.res.bbmL)],['D',RP,sumA(A.res.bbmRp)],['E',RP,sumA(A.res.co.partsTot)],['F',RP,sumA(A.res.total)],['H','#,##0.0',sumA(B.res.bbmL)],['I',RP,sumA(B.res.bbmRp)],['J',RP,sumA(B.res.co.partsTot)],['K',RP,sumA(B.res.total)]]
   .forEach(([c,fm,val])=>put(w,c+rt,F('SUM('+c+H0+':'+c+rl+')',val),BOLD,fm,TOT));
  put(w,'G'+rt,F('G'+rl,cumA),BOLD,RP,TOT);put(w,'L'+rt,F('L'+rl,cumB),BOLD,RP,TOT);put(w,'M'+rt,F('L'+rt+'-G'+rt,cumB-cumA),BOLD,RP,TOT);
  const r2_=rt+2;
  put(w,'A'+r2_,lang==='id'?'Biaya per jam lampu (Rp)':'Cost per lamp hour (Rp)',BOLD);w.mergeCells('A'+r2_+':B'+r2_);
  put(w,'G'+r2_,F('G'+rt+'/'+AS+'$B$9',cumA/p.projectHours),BOLD,RP);put(w,'L'+r2_,F('L'+rt+'/'+AS+'$B$9',cumB/p.projectHours),BOLD,RP);
  const tech=x=>{const sm=x.res.sim,pa=sm.pvAvail,pw=sm.pvWaste,bat=GIDA.SPECS[x.p.model].bat,soh=x.p.degr?Math.max(0.3,1-x.p.degPerYear*x.p.projectHours/x.p.hoursPerYear):1;return [pa/1000,pa>0?(pa-pw)/pa:null,pw/1000,soh,bat*soh/1000,sm.lampBat*x.p.projectHours/bat]};
  const tA_=tech(A),tB_=tech(B);let rr=r2_+2;
  put(w,'A'+rr,U('h_tech'),BOLD,null,SUB);for(let c=2;c<=13;c++)put(w,colL(c)+rr,null,f(),null,SUB);rr++;
  [['k_pva','#,##0'],['k_pvu','0.0%'],['k_pvw','#,##0'],['k_soh','0.0%'],['k_capk','0.00'],['k_efc','#,##0']].forEach(([k,fm],i)=>{
    put(w,'A'+rr,U(k));w.mergeCells('A'+rr+':F'+rr);
    put(w,'G'+rr,tA_[i]===null?'-':tA_[i],f(),fm,null,{horizontal:'right'});put(w,'L'+rr,tB_[i]===null?'-':tB_[i],f(),fm,null,{horizontal:'right'});rr++});
  put(w,'A'+rr,U('n_tech'),NOTE);w.mergeCells('A'+rr+':M'+rr);w.getRow(rr).height=42;w.getCell('A'+rr).alignment={wrapText:true,vertical:'top'};
  w.columns=[{width:8},{width:14},{width:12},{width:16},{width:16},{width:16},{width:19},{width:12},{width:16},{width:16},{width:16},{width:19},{width:20}];
  w.views=[{state:'frozen',xSplit:2,ySplit:H0-1,showGridLines:false}];
  return wb;
}
$('btnXls').onclick=async()=>{
  if(!LAST)return;
  const wb=buildCompareWorkbook(),b=await wb.xlsx.writeBuffer();
  save(new Blob([b],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'GIDA_Compare_'+LAST.A.p.model+'_vs_'+LAST.B.p.model+'_'+LAST.A.p.projectHours+'h.xlsx');
};
